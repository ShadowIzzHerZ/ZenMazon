<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Zen policies</title>
<script src=/theme.js></script>
<link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel=stylesheet>
<link rel=stylesheet href=/theme.css>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:72px;background:var(--bg);color:var(--fg);font:400 14px/20px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
code,kbd,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--fg2);text-decoration:none}a:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line)}
.bar b{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}.bar nav{display:flex;gap:20px;align-items:center}
.wrap{max-width:1200px;margin:0 auto;padding:32px}
h1{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin:0}.sub{color:var(--fg2);margin:8px 0 24px;max-width:680px;font-size:15px;line-height:22px}
.tr{display:grid;grid-template-columns:48px minmax(0,1.6fr) 132px minmax(0,1fr) 88px 88px 88px;gap:16px;align-items:center;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.h{min-height:40px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--fg2);border-top:1px solid var(--line)}
.tr .num{text-align:right;font-variant-numeric:tabular-nums}.tr .zero{color:var(--fg3)}
.tr .txt{font-size:14px}
kbd{display:inline-block;min-width:24px;padding:0 6px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;background:var(--raised);color:var(--accent);font-size:12px;line-height:20px;text-align:center}
.bars{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--raised)}.bars i{display:block;height:100%}
.bars .bad{background:var(--bad)}.bars .warn{background:var(--warn)}
.legend{display:flex;gap:24px;font-size:13px;color:var(--fg2);margin:0 0 16px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:8px;height:8px;border-radius:2px}
.cap{font-size:13px;color:var(--fg3);margin:16px 0 0;max-width:720px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:9999px;border:1px solid;font-size:12px;font-weight:500;white-space:nowrap}
.pill.deny{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}.pill.approve{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
@media(max-width:900px){.bar{padding:0 16px}.wrap{padding:16px}.tr{grid-template-columns:48px 1fr auto;gap:4px 12px}.tr.h,.tr .bars,.tr .c2,.tr .c3{display:none}}
</style>
<script src=/auth.js></script>
<div class=bar><b><span class=mark aria-hidden=true><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg></span>Zen</b><nav><a href=/app>Chat</a><a href=/dashboard>Dashboard</a><button class=tt data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme"><svg class=moon viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg><svg class=sun viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></nav></div>
<div class=wrap>
<h1>Policies</h1>
<p class=sub>Every rule the policy engine enforces, in plain English, ranked by how often it has fired. A deny stops the action. An approval pauses it until a person decides.</p>
<div class=legend><span><i style="background:var(--bad)"></i>Blocked</span><span><i style="background:var(--warn)"></i>Sent to a human</span></div>
<div id=t></div>
<p class=cap id=cap></p>
</div>
<div class=acct id=acct></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
const sum=o=>o.blocked+o.asked
const num=(n,tip)=>`<span class="num mono ${n?'':'zero'}" ${tip?`title="${tip}"`:''}>${n}</span>`
fetch('/api/policy-impact').then(r=>r.json()).then(d=>{
const R=d.rules.map(r=>({...r,total:sum(r.tests)+sum(r.batch)+r.chats.blocked+r.chats.asked}))
R.sort((a,b)=>b.total-a.total||a.id.localeCompare(b.id))
const mx=Math.max(1,...R.map(r=>r.total))
$('t').innerHTML=`<div class="tr h"><span>ID</span><span>Rule</span><span>Action</span><span>Impact</span><span style="text-align:right">Test cases</span><span class=c2 style="text-align:right">Batch run</span><span class=c3 style="text-align:right">Your chats</span></div>`+R.map(r=>{
const bl=sum({blocked:r.tests.blocked+r.batch.blocked+r.chats.blocked,asked:0}),as=r.tests.asked+r.batch.asked+r.chats.asked
const ch=r.chats,tip=`${ch.blocked} blocked, ${ch.asked} sent to a human, ${ch.approved} approved, ${ch.rejected} rejected`
return `<div class=tr><kbd>${r.id}</kbd><span class=txt>${esc(r.text)}</span><span><span class="pill ${r.verdict}">${r.verdict=='deny'?'Blocks':'Asks a human'}</span></span>
<div class=bars title="${bl} blocked, ${as} sent to a human in total"><i class=bad style="width:${bl/mx*100}%"></i><i class=warn style="width:${as/mx*100}%"></i></div>
${num(sum(r.tests))}<span class=c2>${num(sum(r.batch))}</span><span class=c3>${num(ch.blocked+ch.asked,tip)}</span></div>`}).join('')
$('cap').textContent=(d.has_tests?'Test cases: the 30 evaluation cases with the policy layer on. ':'No evaluation results yet. ')+(d.has_batch?'Batch run: your latest run on the dashboard. ':'Batch run: run it on the dashboard to fill this column. ')+'Your chats: blocks and approval requests in your audit log, last 500 entries. Hover a number for the split.'})
</script>
