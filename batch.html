<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Zen batch run</title>
<link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel=stylesheet>
<script src=/theme.js></script>
<link rel=stylesheet href=/theme.css>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:72px;background:var(--bg);color:var(--fg);font:400 14px/20px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
code,kbd,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--fg2);text-decoration:none}a:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line)}
.bar b{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}.bar nav{display:flex;gap:20px;align-items:center}
.wrap{max-width:1200px;margin:0 auto;padding:32px}
h1{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin:0}.sub{color:var(--fg2);margin:8px 0 24px;max-width:640px;font-size:15px;line-height:22px}
.btn{height:40px;padding:0 20px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--fg);font:500 14px/1 Inter,system-ui,sans-serif;cursor:pointer;transition:background-color 150ms var(--ease),transform 150ms var(--ease)}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:default}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.head .note{color:var(--fg3);font-size:13px}
#out{margin-top:32px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--raised);margin:12px 0}
.split i{display:block;height:100%}.split .ok{background:var(--ok)}.split .warn{background:var(--warn)}.split .bad{background:var(--bad)}
.legend{display:flex;gap:32px;flex-wrap:wrap}.legend div{min-width:120px}.legend .n{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}.legend .k{display:flex;align-items:center;gap:8px;color:var(--fg2)}
.legend .k i{width:8px;height:8px;border-radius:2px}
.score{margin:24px 0 32px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;gap:32px;flex-wrap:wrap}
.score div{min-width:160px}.score b{display:block;font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}.score span{color:var(--fg2);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:0;flex-wrap:wrap}
.tabs button{height:40px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--fg2);font:500 14px/1 Inter,system-ui,sans-serif;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--accent)}.tabs b{font-weight:400;color:var(--fg3);margin-left:6px;font-variant-numeric:tabular-nums}
.tr{display:grid;grid-template-columns:72px minmax(0,1fr) 112px 148px minmax(0,1.1fr);gap:16px;align-items:center;min-height:48px;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.h{min-height:40px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--fg2)}
.tr .id{color:var(--fg3);font-size:12px}.tr .amt{text-align:right;font-variant-numeric:tabular-nums}
.tr .why{font-size:13px;color:var(--fg2)}.tr .why kbd{margin-right:8px}
.tr .txt small{display:block;color:var(--fg3);font-size:12px;line-height:16px}
.miss{border-left:2px solid var(--bad);padding-left:12px}
kbd{display:inline-block;min-width:24px;padding:0 6px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;background:var(--raised);color:var(--accent);font-size:12px;line-height:20px;text-align:center}
.more{margin-top:16px}
.empty{color:var(--fg3);padding:24px 0}
.live{border-top:1px solid var(--line);margin-top:24px}.livehead{display:flex;justify-content:space-between;align-items:center;margin-top:24px;color:var(--fg2);font-size:13px}
.livehead button{border:0;background:none;color:var(--fg2);font:inherit;cursor:pointer;padding:0;text-decoration:underline}.livehead button:hover{color:var(--fg)}
.live .tr{animation:in .25s var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.toasts{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column-reverse;gap:8px;z-index:20;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 16px;border:1px solid var(--warn-bd);border-left:3px solid var(--warn);border-radius:12px;background:var(--card);box-shadow:0 4px 12px rgba(30,23,27,.12);animation:toast .3s var(--ease) both;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateX(-12px)}.toast .t{font-size:13px;line-height:18px;color:var(--fg);grid-column:1/-1}.toast .m{font-size:12px;color:var(--warn);font-weight:500}.toast .w{font-size:12px;color:var(--fg2)}
@keyframes toast{from{opacity:0;transform:translateX(-24px)}}
@media(max-width:900px){.bar{padding:0 16px}.wrap{padding:16px}.tr{grid-template-columns:1fr auto;gap:4px 16px}.tr.h{display:none}.tr .id,.tr .why{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src=/auth.js></script>
<div class=bar><b><span class=mark aria-hidden=true><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg></span>Zen</b><nav><a href=/app>Chat</a><a href=/dashboard>Dashboard</a><button class=tt data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme"><svg class=moon viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg><svg class=sun viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></nav></div>
<div class=wrap>
<h1>Batch run</h1>
<p class=sub>Generate 500 made-up Indian corporate transactions: expense claims, vendor and staff payments, and travel bookings. Some carry planted problems. Every one goes through the policy engine, which flags what breaks a rule. No AI model is called, so it takes a moment.</p>
<div class=head><button class="btn primary" id=run>Run 500 transactions</button><span class=note id=note></span></div>
<div id=out></div>
</div>
<div class=toasts id=toasts aria-hidden=true></div>
<div class=acct id=acct></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
const IC={allow:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',approve:'<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>',deny:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>'}
const LAB={allow:'Allowed',approve:'Needs approval',deny:'Blocked'},CLS={allow:'ok',approve:'warn',deny:'bad'}
const rs=n=>n==null?'':'Rs '+Number(n).toLocaleString('en-IN')
let D=null,tab='deny',shown=60
const TABS=[['deny','Blocked'],['approve','Needs approval'],['allow','Allowed'],['miss','Missed']]
const inTab=(r,t)=>t=='miss'?(r.expected=='deny'&&r.verdict!='deny'):r.verdict==t
function counts(rows){const c={allow:0,approve:0,deny:0};rows.forEach(r=>c[r.verdict]++);return c}
function summary(c,k){const n=D.n
$('sum').innerHTML=`<div class=split>${['allow','approve','deny'].map(x=>`<i class=${CLS[x]} style="width:${c[x]/n*100}%"></i>`).join('')}</div>
<div class=legend>${['deny','approve','allow'].map(x=>`<div><div class=k><i style="background:var(--${CLS[x]})"></i>${LAB[x]}</div><div class=n>${c[x]}</div></div>`).join('')}<div><div class=k>Checked</div><div class=n>${k}<span style="color:var(--fg3);font-size:16px"> / ${n}</span></div></div></div>`}
let lastToast=0
function toast(r){const now=Date.now();if(now-lastToast<700)return;lastToast=now;const box=$('toasts');while(box.children.length>=3)box.firstChild.remove()
const d=document.createElement('div');d.className='toast';d.innerHTML=`<span class=m>Needs approval</span><span class=w>${r.rule?esc(r.rule)+' · ':''}${esc(r.id)}</span><span class=t>${esc(r.text)}</span>`;box.appendChild(d)
setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},3500)}
function table(){const rows=D.rows.filter(r=>inTab(r,tab));
$('tabs').innerHTML=TABS.map(([k,l])=>`<button role=tab aria-selected=${k==tab} data-t=${k}>${l}<b>${D.rows.filter(r=>inTab(r,k)).length}</b></button>`).join('')
$('tbl').innerHTML=rows.length?`<div class="tr h"><span>ID</span><span>Transaction</span><span style="text-align:right">Amount</span><span>Verdict</span><span>Rule</span></div>`+rows.slice(0,shown).map(r=>`<div class="tr ${tab=='miss'?'miss':''}"><span class="id mono">${r.id}</span><span class=txt>${esc(r.text)}${tab=='miss'?`<small>Planted problem: ${esc(r.plant)}. The rules did not catch it.</small>`:''}</span><span class="amt mono">${rs(r.amount)}</span><span class="verdict ${r.verdict}">${IC[r.verdict]}${LAB[r.verdict]}</span><span class=why>${r.rule?`<kbd>${r.rule}</kbd>${esc(r.reason)}`:'No rule applies'}</span></div>`).join('')+(rows.length>shown?`<button class="btn more" id=more>Show ${Math.min(100,rows.length-shown)} more</button>`:''):'<div class=empty>Nothing here</div>'
if($('more'))$('more').onclick=()=>{shown+=100;table()}}
$('out').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;shown=60;table()}}
$('run').onclick=async()=>{const b=$('run');b.disabled=true;b.textContent='Running';$('out').innerHTML='<div id=sum></div><div class=livehead><span>Checking each transaction as it comes in</span><button id=skip>Skip to results</button></div><div class=live id=live></div>';$('note').textContent=''
D=await fetch('/api/batch',{method:'POST',body:JSON.stringify({n:500})}).then(r=>r.json())
if(D.error){$('out').innerHTML=`<div class=empty>${esc(D.error)}</div>`;b.disabled=false;b.textContent='Run 500 transactions';return}
let k=0,skip=false;const c={allow:0,approve:0,deny:0};$('skip').onclick=()=>skip=true
await new Promise(res=>{const t=setInterval(()=>{
if(skip){D.rows.slice(k).forEach(r=>c[r.verdict]++);k=D.n;summary(c,k);clearInterval(t);return res()}
const r=D.rows[k++];c[r.verdict]++;summary(c,k)
const row=document.createElement('div');row.className='tr';row.innerHTML=`<span class="id mono">${r.id}</span><span class=txt>${esc(r.text)}</span><span class="amt mono">${rs(r.amount)}</span><span class="verdict ${r.verdict}">${IC[r.verdict]}${LAB[r.verdict]}</span><span class=why>${r.rule?`<kbd>${r.rule}</kbd>${esc(r.reason)}`:'No rule applies'}</span>`
$('live').prepend(row);while($('live').children.length>10)$('live').lastChild.remove()
if(r.verdict=='approve')toast(r)
if(k>=D.n){clearInterval(t);res()}},30)})
const acc=Math.round(D.correct/D.n*1000)/10
$('out').insertAdjacentHTML('beforeend',`<div class=score><div><b>${D.caught} of ${D.planted}</b><span>planted violations caught</span></div><div><b>${D.missed}</b><span>missed, listed under Missed</span></div><div><b>${D.false_alarms}</b><span>false alarms on clean records</span></div><div><b>${acc}%</b><span>verdicts matched what was expected</span></div></div><div class=tabs id=tabs role=tablist></div><div id=tbl></div>`)
$('live').previousElementSibling.remove();$('live').remove();tab='deny';shown=60;table();b.disabled=false;b.textContent='Run again';$('note').textContent='Seed '+D.seed}
</script>
